# ASP.NET Core API. ${API_IMAGE} is filled in by the deploy workflow (envsubst).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mygarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: mygarden
    spec:
      imagePullSecrets:
        - name: ghcr # optional, only needed while the GHCR packages are private
      containers:
        - name: api
          image: ${API_IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mygarden-db
                  key: password
            # $(VAR) is expanded by Kubernetes from the variable above
            - name: ConnectionStrings__Default
              value: Host=db;Port=5432;Database=mygarden;Username=mygarden;Password=$(POSTGRES_PASSWORD)
            - name: Database__MigrateOnStartup
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
# Must be called "api": docker/nginx.conf proxies /api/ to http://api:8080
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: mygarden
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 8080
