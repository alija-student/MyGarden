name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore MyGarden.sln

      - name: Lint (code style from .editorconfig)
        run: dotnet format MyGarden.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MyGarden.sln --configuration Release --no-restore

      # Integration tests use Testcontainers; Docker is preinstalled on ubuntu-latest
      - name: Test
        run: dotnet test MyGarden.sln --configuration Release --no-build

  frontend:
    name: Frontend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false

  e2e:
    name: E2E (Playwright against the full stack)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start stack (db + api + web)
        run: docker compose --profile app up -d --build --wait

      - name: Wait for API through nginx
        run: timeout 60 bash -c 'until curl -fs http://localhost:8081/api/health; do sleep 2; done'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Container logs
        if: failure()
        run: docker compose --profile app logs
