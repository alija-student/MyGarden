name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore MyGarden.sln

      - name: Lint (code style from .editorconfig)
        run: dotnet format MyGarden.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MyGarden.sln --configuration Release --no-restore

      # Integration tests use Testcontainers; Docker is preinstalled on ubuntu-latest
      - name: Test
        run: dotnet test MyGarden.sln --configuration Release --no-build

  frontend:
    name: Frontend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false
